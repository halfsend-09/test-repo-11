# Behaviour-test mint probe shim (pkg/behaviourtest/steps/mint_probe.go).
# Pushed to a temporary branch of the leased test repository; scenario
# cleanup deletes the branch.
name: mint-probe-014a14a7

on:
  push:
    branches: ['behaviour/mint-probe-014a14a7']

permissions: {}

jobs:
  # Same-repository request through the approved host: must mint.
  control:
    permissions:
      contents: read
      id-token: write
    uses: halfsend-09/test-repo-11-mint-host/.github/workflows/mint-probe.yml@main
    with:
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      role: 'review'
      level: 'write'
      repos_json: '["test-repo-11"]'
      artifact_name: 'mint-probe-control'

  # The request under test.
  subject:
    permissions:
      contents: read
      id-token: write
    uses: halfsend-09/test-repo-11-mint-host/.github/workflows/mint-probe.yml@main
    with:
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      role: 'review'
      level: 'write'
      repos_json: '["test-repo-11-mint-host"]'
      artifact_name: 'mint-probe-subject'
